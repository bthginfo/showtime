<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#43735a" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>try{const media=matchMedia('(prefers-color-scheme: dark)');const apply=()=>{const theme=localStorage.getItem('showtime-theme')||'system';document.documentElement.dataset.theme=theme==='system'?(media.matches?'dark':'light'):theme;};apply();media.addEventListener('change',apply);window.addEventListener('storage',apply);window.addEventListener('digitalmask-storage',apply);}catch{}</script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div style="display:contents">%sveltekit.body%</div></body>
</html>
