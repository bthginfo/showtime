<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#43735a" />
    <link rel="icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        const media = matchMedia("(prefers-color-scheme: dark)");
        const apply = () => {
          const theme = localStorage.getItem("showtime-theme") || "system";
          document.documentElement.dataset.theme =
            theme === "system" ? (media.matches ? "dark" : "light") : theme;
        };
        apply();
        media.addEventListener("change", apply);
        window.addEventListener("storage", apply);
        window.addEventListener("digitalmask-storage", apply);
      } catch {}
    </script>
    <style>
      .showtime-boot {
        --boot-bg: #fff;
        --boot-text: #26332e;
        --boot-muted: #66736b;
        --boot-border: #dbe3db;
        --boot-accent: #16735c;
        max-width: 480px;
        margin: 10vh auto;
        padding: 28px;
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background: var(--boot-bg);
        color: var(--boot-text);
        font:
          16px/1.6 Geist,
          "Segoe UI",
          sans-serif;
      }
      html[data-theme="dark"] .showtime-boot {
        --boot-bg: #202a25;
        --boot-text: #e8eee8;
        --boot-muted: #a4b3a8;
        --boot-border: #35433a;
        --boot-accent: #80cdb0;
      }
      .showtime-boot[hidden],
      .showtime-boot [hidden] {
        display: none;
      }
      .showtime-boot .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 28px;
      }
      .showtime-boot img {
        width: 38px;
        height: 38px;
      }
      .showtime-boot h1 {
        font-size: 28px;
        line-height: 1.2;
        letter-spacing: -0.025em;
        margin: 0 0 16px;
      }
      .showtime-boot p {
        margin: 0 0 24px;
        color: var(--boot-muted);
        font-size: 14px;
      }
      .showtime-boot .boot-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .showtime-boot button,
      .showtime-boot a {
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        min-height: 46px;
        padding: 12px 18px;
        border: 1px solid var(--boot-border);
        border-radius: 7px;
        background: transparent;
        color: var(--boot-text);
        text-decoration: none;
        cursor: pointer;
      }
      .showtime-boot button {
        border-color: var(--boot-accent);
        background: var(--boot-accent);
        color: var(--boot-bg);
      }
      .showtime-boot button:focus-visible,
      .showtime-boot a:focus-visible {
        outline: 3px solid var(--boot-accent);
        outline-offset: 3px;
      }
      @media (max-width: 540px) {
        .showtime-boot {
          margin: 32px 20px;
          padding: 24px;
        }
      }
    </style>
    <script id="showtime-boot-script">
      (() => {
        // Register without waiting for the application bundle, which may itself fail to download.
        if ("serviceWorker" in navigator)
          void navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .catch(() => undefined);
        let failed = false;
        let timer;
        function update() {
          const fallback = document.getElementById("showtime-boot");
          const app = document.getElementById("showtime-app");
          if (!fallback || !app) return;
          const content = app.querySelector('main,h1,[role="main"]');
          fallback.hidden = Boolean(content && content.textContent.trim());
          if (fallback.hidden) clearTimeout(timer);
          if (failed) {
            document.getElementById("boot-title").textContent =
              "Showtime konnte nicht geladen werden.";
            document.getElementById("boot-message").textContent =
              "Die Verbindung wurde beim Laden unterbrochen. Prüfe deine Verbindung und lade die Seite erneut. Deine gespeicherten Daten bleiben erhalten.";
            document.getElementById("boot-actions").hidden = false;
          }
        }
        function fail() {
          failed = true;
          update();
        }
        window.addEventListener("unhandledrejection", (event) => {
          if (
            /fetch|network|module|import/i.test(String(event.reason?.message || event.reason || ""))
          )
            fail();
        });
        window.addEventListener(
          "error",
          (event) => {
            if (event.target?.tagName === "SCRIPT") fail();
          },
          true,
        );
        document.addEventListener("DOMContentLoaded", () => {
          document.getElementById("boot-retry").addEventListener("click", () => location.reload());
          new MutationObserver(update).observe(document.getElementById("showtime-app"), {
            childList: true,
            subtree: true,
            characterData: true,
          });
          timer = setTimeout(fail, 10000);
          update();
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="showtime-app" style="display: contents">%sveltekit.body%</div>
    <section id="showtime-boot" class="showtime-boot" role="status" hidden>
      <div class="boot-brand"><img src="/icon.svg" alt="" />showtime</div>
      <h1 id="boot-title">Showtime wird geladen …</h1>
      <p id="boot-message">Dein Arbeitsraum wird vorbereitet.</p>
      <div id="boot-actions" class="boot-actions" hidden>
        <button id="boot-retry" type="button">Erneut laden</button>
        <a href="/offline.html">Zeit offline vormerken</a>
      </div>
    </section>
  </body>
</html>
